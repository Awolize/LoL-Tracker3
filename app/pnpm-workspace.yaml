# Dependency lifecycle scripts are denied by default. pnpm 11 removed
# `onlyBuiltDependencies` / `neverBuiltDependencies` in favour of `allowBuilds`,
# so the previous list here was dead config. Anything not listed is unreviewed.
# https://pnpm.io/settings/build#allowbuilds
strictDepBuilds: true

allowBuilds:
    # Required: links the platform binary. Vite, Rolldown and tsx all rely on it.
    esbuild: true

    # Inert as of sharp 0.35: it no longer ships an install/postinstall script
    # (0.34's `install/check.js` is gone; only a manually-invoked `build` script
    # remains), so `strictDepBuilds` has nothing left to review here. Kept as a
    # deny so that a script reappearing stays blocked. The @img/sharp-* platform
    # packages carry the prebuilt binding (libvips 8.18.x), and that is all this
    # app needs — app/src/routes/api/images/$.ts only calls sharp().webp().
    # (The old note about SHARP_FORCE_GLOBAL_LIBVIPS / a global libvips of
    # >= 8.17.3 no longer applies: source builds are opt-in now, `npm explore
    # sharp -- npm run build`, and the config threshold is >= 8.18.7.)
    sharp: false

    # Required: the Sentry Vite plugin in vite.config.ts uploads source maps with
    # this CLI, so its binary has to be fetched at install time.
    "@sentry/cli": true

    # Optional native accelerator for msgpackr (pulled in by BullMQ). msgpackr
    # wraps the require in try/catch and falls back to pure JS, so its build
    # script — and the native compilation that comes with it — stays denied.
    msgpackr-extract: false

