name: LoL-Tracker3-dev
services:
  web:
    container_name: web
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VITE_SENTRY_ORG: ${VITE_SENTRY_ORG}
        VITE_SENTRY_PROJECT: ${VITE_SENTRY_PROJECT}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      RIOT_API_KEY: ${RIOT_API_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      PORT: 3000
    ports:
      - "3001:3000"
    restart: unless-stopped
    depends_on:
      - db
      - rustfs
    networks:
      - internal-net

  db:
    image: postgres:18-alpine
    container_name: db-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: 5432
    ports:
      - "5432:5432"
    volumes:
      - ./db/data:/var/lib/postgresql
      - ./db/share:/pgshare
      - ./db/scripts:/pgscripts:ro
    networks:
      - internal-net

  # RustFS — S3-compatible object storage (Apache-2.0), the MinIO successor.
  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: lol-rustfs-dev
    user: "1000:1000" # match the host user so ./rustfs/data stays writable
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console -> http://localhost:9001/rustfs/console/
    volumes:
      - ./rustfs/data:/data
      - ./rustfs/logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal-net

  # One-shot: creates the "images" bucket the app expects (idempotent).
  # Uses `rc`, the RustFS project's own mc-compatible S3 CLI (MIT/Apache-2.0).
  rustfs-init:
    image: rustfs/rc:v0.1.36
    container_name: lol-rustfs-init-dev
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RC_ENDPOINT: http://rustfs:9000
      RC_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      RC_SECRET_KEY: ${MINIO_SECRET_KEY}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - rc alias set local "$$RC_ENDPOINT" "$$RC_ACCESS_KEY" "$$RC_SECRET_KEY" && rc bucket create local/images --ignore-existing
    restart: "no"
    networks:
      - internal-net

  valkey:
    image: valkey/valkey:9-alpine
    container_name: valkey-dev
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  valkey_data:
