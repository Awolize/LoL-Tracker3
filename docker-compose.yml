services:
  web:
    container_name: lol-web2
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VITE_SENTRY_ORG: ${VITE_SENTRY_ORG}
        VITE_SENTRY_PROJECT: ${VITE_SENTRY_PROJECT}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      RIOT_API_KEY: ${RIOT_API_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      VALKEY_HOST: redis
      VALKEY_PORT: 6379
      PORT: 3000
    ports:
      - "9103:3000"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.enable=true"
      - "traefik.docker.network=webnet"
      - "traefik.http.routers.lol-web2.rule=Host(`lol.awot.dev`)"
      - "traefik.http.routers.lol-web2.entrypoints=websecure"
      - "traefik.http.routers.lol-web2.tls.certresolver=myresolver"
      - "traefik.http.services.lol-web2.loadbalancer.server.port=3000"
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lol-network
      - webnet

  db:
    image: postgres:18-alpine
    container_name: lol-db2
    pull_policy: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: 5432
    restart: unless-stopped
    volumes:
      - ./db/data:/var/lib/postgresql
      - ./db/share:/pgshare
      - ./db/scripts:/pgscripts:ro
    ports:
      - "9132:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lol-network

  # RustFS — S3-compatible object storage (Apache-2.0), the MinIO successor.
  # Replaces minio/minio, whose Docker Hub repository was withdrawn in 2025-2026.
  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: lol-rustfs2
    pull_policy: always
    # The image defaults to UID/GID 10001:10001; run as the host user so the
    # bind mounts below are writable without needing root to chown them.
    # Change both numbers if the deploy user is not UID/GID 1000.
    user: "1000:1000"
    environment:
      # The app reads S3_* (preferred) or the legacy MINIO_* names —
      # see app/src/server/external/s3.ts. These are the credentials RustFS authenticates with.
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: info
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    ports:
      - "9100:9000" # S3 API
      - "9105:9001" # Console -> http://localhost:9105/rustfs/console/
    volumes:
      - ./rustfs/data:/data
      - ./rustfs/logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lol-network

  # One-shot: the app reads/writes the "images" bucket but never creates it.
  # Uses `rc`, the RustFS project's own mc-compatible S3 CLI (MIT/Apache-2.0),
  # instead of the 134 MB amazon/aws-cli image. --ignore-existing makes it
  # idempotent, so it is safe on every `up`.
  rustfs-init:
    image: rustfs/rc:v0.1.36
    container_name: lol-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RC_ENDPOINT: http://rustfs:9000
      RC_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      RC_SECRET_KEY: ${MINIO_SECRET_KEY}
    entrypoint: ["/bin/sh", "-ec"]
    # `rc alias set` writes ~/.config/rc/config.toml inside the container (HOME is
    # writable), then `rc bucket create` is a no-op if the bucket already exists.
    command:
      - rc alias set local "$$RC_ENDPOINT" "$$RC_ACCESS_KEY" "$$RC_SECRET_KEY" && rc bucket create local/images --ignore-existing
    restart: "no"
    networks:
      - lol-network

  redis:
    image: valkey/valkey:9-alpine
    container_name: lol-redis2
    pull_policy: always
    ports:
      - "9139:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - lol-network

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    networks:
      - lol-network

volumes:
  redis_data:

networks:
  lol-network:
    driver: bridge
  webnet:
    external: true
